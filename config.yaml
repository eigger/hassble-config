  # Parking beacon — instance_mode: shared → MAC 무관, manufacturer 0x035D 광고가 하나의 엔티티 공유
  # 요청 6바이트: [0]=02 [1]=05 [2]=00 [3]=battery [4]=state [5]=counter
  # 응답 14바이트: [0]=04(응답타입), [1..6]=KeyMAC, [7..10]=월·일·시·분, [11]=층(256-raw), [12..13]=구역코드
  # 04xx: 주차위치 응답 비콘, 07xx: SmartKey 인증(22B 암호화), 02xx: 출입 이벤트(6B) — prefix "04" 로 응답만 매칭
  - id: parking_beacon
    name: "Parking Beacon"
    source: advertisement
    instance_mode: shared
    match:
      manufacturer_id: 861            # 0x035D
      manufacturer_hex_prefix: "04"   # 응답 비콘만 매칭 (07=SmartKey 인증, 02=출입 이벤트 제외)
      manufacturer_min_length: 14     # 최소 14바이트
    advertise:
      manufacturer_id: 861            # 0x035D
      # 02 05 00 | battery 100% | {state} | {counter} — 카운터는 버튼마다 +1, 버스트 중 고정
      payload: "02050064{state:02X}{counter:02X}"
      counter_mode: persist          # 요청마다 누적. 0xFF 다음은 0
      counter_start: 0
      mode: low_latency              # ~100ms → press 200ms 동안 약 1~2패킷
      tx_power: high
      timeout: 4s                    # 페이즈 합(3.2s)보다 약간 큰 상한
      local_name: "APT SmartKey"     # Complete Local Name. 송신 중 이 이름으로 바꾸고, 종료·재시작 때 초기값으로 되돌림
      payload_phases:
        - state: 65                  # 0x41 버튼 누름 + ACK 대기
          duration: 200ms
        - state: 64                  # 0x40 홀드 + ACK 대기
          duration: 3s
      stop_on_response: true
    controls:
      - key: request_location
        type: button
        name: "주차위치 요청"
        action: advertise
        icon: mdi:car-search
    sensors:
      - key: parking_time
        device_class: timestamp
        icon: mdi:clock-time-four-outline
        source_field: manufacturer_data
        length: 14
        decode: { offset: 7, length: 4, type: timestamp }
      - key: parking_floor
        icon: mdi:layers-outline
        source_field: manufacturer_data
        length: 14
        accuracy_decimals: 0
        decode: { offset: 11, length: 1, type: uint8, scale: -1, offset_value: 256 }
      - key: parking_location
        platform: text_sensor
        icon: mdi:map-marker-outline
        source_field: manufacturer_data
        length: 14
        decode: { offset: 12, length: 2, type: string }

  # APT SmartKey 출입문 이벤트 — 고정 MAC으로 하드웨어 필터, 02xx 6바이트 패킷만 파싱
  # payload 6바이트: [0]=02(이벤트타입), [1..3]=05 00 55, [4]=상태, [5]=카운터
  # byte[4] 상태값: 0x41(65)=entering_start, 0x01(1)=entering, 0x40(64)=exiting, 0x00(0)=idle
  # 0x41→0x01 두 값 모두 "entering"으로 매핑 → on_change_only가 중간 전환 노이즈 제거
  - id: apt_key_door
    name: "APT Door Event"
    source: advertisement
    instance_mode: shared
    match:
      manufacturer_id: 861            # 0x035D
      manufacturer_hex_prefix: "02"   # 출입 이벤트 타입만 (07xx=인증 22B, 04xx=주차응답 14B 제외)
    sensors:
      - key: door_status
        platform: text_sensor
        icon: mdi:door
        source_field: manufacturer_data
        length: 6
        publish:
          min_interval: 1s            # 기본 10s 오버라이드 — 이벤트가 수 초 내 전환됨
        decode:
          offset: 4
          length: 1
          type: uint8
          map:
            "65": "entering"          # 0x41 인증 시작
            "1": "entering"           # 0x01 인증 완료 (entering과 동일 → 전환 노이즈 제거)
            "64": "exiting"           # 0x40
            "0": "idle"               # 0x00

  # ──────────────────────────────────────────────────────────────
  # Path C: OBD (ELM327) over BLE
  # ──────────────────────────────────────────────────────────────
  - id: car_obd
    name: "Vehicle OBD"
    source: obd
    obd:
      service_uuid: "18F0"
      tx_char_uuid: "2AF1"
      rx_char_uuid: "2AF0"
      tx_delay: 50ms
      init_commands:
        - "ATSP6"
    sensors:
      #- { key: rpm,          preset: rpm,                 update_interval: 1s }
      #- { key: speed,        preset: speed,               update_interval: 1s }
      #- { key: engine_load,  preset: engine_load,         update_interval: 1s }
      #- { key: throttle,     preset: throttle,            update_interval: 1s }
      #- { key: coolant_temp, preset: coolant_temp,        update_interval: 10s }
      #- { key: intake_temp,  preset: intake_air_temp,     update_interval: 10s }
      #- { key: ambient_temp, preset: ambient_temp,        update_interval: 30s }
      - { key: battery,      preset: battery_voltage,     update_interval: 10s }
      - { key: run_time,     preset: run_time,            update_interval: 5s }
      - { key: odometer,     preset: odometer,            update_interval: 30s }
      - key: fuel_level
        preset: fuel_level
        update_interval: 30s
        publish:
          deadband: 0.5
          min_interval: 60s
      # GM Extensions (mode 22)
      #- { key: gear,         preset: gm_current_gear,     update_interval: 1s }
      #- { key: prnd,         preset: gm_prnd_status_alt,  update_interval: 1s }
      #- { key: torque,       preset: actual_torque,       update_interval: 1s }
      #- { key: oil_pressure, preset: gm_oil_pressure,     update_interval: 2s }
      #- { key: trans_temp,   preset: gm_trans_temp,       update_interval: 10s }

